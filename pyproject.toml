[project]
name = "uniassist"
version = "0.1.0"
description = "Local-first RAG + ticket-triage assistant for university ICT service desk."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "M. Rafagnin" }]
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.2,<0.3",
    "langchain-chroma>=0.1,<0.2",
    "chromadb>=0.5,<0.6",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "streamlit>=1.39,<2.0",
    "httpx>=0.27,<0.28",
    "selectolax>=0.3.21",
    "markdownify>=0.13",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniassist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
